name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The agent under test. Point this at your own callable (package.module:callable).
  AGENT_SPEC: evalharness.sample_agents:stable_agent

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Offline demo
        run: python demo/run_demo.py

  eval-gate:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Validate the golden set
        run: evalharness validate --golden golden/golden_set.jsonl

      - name: Run the golden set through the candidate agent
        run: >
          evalharness run --golden golden/golden_set.jsonl --agent "$AGENT_SPEC"
          --judge mock --label "candidate-${GITHUB_SHA::7}" --out runs/candidate.json

      # This is the gate: exit code 1 on any regression fails the job.
      - name: Compare with the committed baseline
        run: >
          evalharness compare baselines/baseline.json runs/candidate.json
          --report runs/report.md

      - name: Publish the report
        if: always()
        run: |
          if [ -f runs/report.md ]; then cat runs/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: runs/
          if-no-files-found: ignore

      # Proves the gate still bites: a known-bad agent must be rejected.
      - name: Gate self-test
        run: |
          evalharness run --golden golden/golden_set.jsonl \
            --agent evalharness.sample_agents:regressed_agent \
            --judge mock --label known-bad --out runs/known-bad.json > /dev/null
          if evalharness compare baselines/baseline.json runs/known-bad.json > /dev/null; then
            echo "The gate accepted a known-bad agent." >&2
            exit 1
          fi
          echo "The gate rejected the known-bad agent, as it should."
