[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Regression-gated evaluation harness for a customer service agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
evalharness = "evalharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
